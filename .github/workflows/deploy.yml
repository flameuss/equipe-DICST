name: Build, Test, Audit & Deploy CCST/DIIAV Team Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify spreadsheet contains no Google Drive links
        run: |
          node -e "import('node:fs/promises').then(async fs => { const JSZip = (await import('jszip')).default; const z = await JSZip.loadAsync(await fs.readFile('Criação do Perfil Web CCST 2026-2027 (respostas).xlsx')); for (const [n, e] of Object.entries(z.files)) { if (e.dir) continue; const s = await e.async('string'); if (/drive\.google\.com/i.test(s)) { console.error('Drive link found in', n); process.exit(1); } } console.log('Spreadsheet verified clean (0 Drive links).'); })"

      - name: Generate team dataset and match local photos
        run: npm run build:data

      - name: Run unit, data integrity, and UI tests
        run: npm test

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build static site for GitHub Pages
        run: npm run build

      - name: Verify no Drive links or test records leaked into dist
        run: |
          if grep -REIn "drive\.google\.com|DIIAV INPE|webccst@gmail\.com" dist/; then
            echo "ERROR: Restricted data detected in dist/!"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
